# Optional: local Postgres 16 for migration/dev only (Neon is production).
# Not required for `pnpm dev` / Vercel. See legacy/python/README.md for archived Python stack.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spcup
      POSTGRES_PASSWORD: spcup
      POSTGRES_DB: spcup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
